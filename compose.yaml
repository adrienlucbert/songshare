services:
  songshare:
    build:
      context: .
    restart: unless-stopped
    env_file:
      - path: ./.env
        required: true
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_URL: postgres://root:mysecretpassword@db:5432/local
    ports:
      - 3000:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - songshare

  migrate:
    build:
      context: .
      target: builder
    environment:
      DATABASE_URL: postgres://root:mysecretpassword@db:5432/local
    depends_on:
      db:
        condition: service_healthy
    command: ["npm", "run", "db:migrate"]
    networks:
      - songshare

  db:
    image: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_DB: local
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d local"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql
    networks:
      - songshare

  gatus:
    image: twinproduction/gatus:latest
    restart: unless-stopped
    volumes:
      - ./gatus.yaml:/config/config.yaml:ro
      - gatus:/data
    depends_on:
      - songshare
    networks:
      - songshare

networks:
  songshare:

volumes:
  pgdata:
  gatus:

storage:
  type: sqlite
  path: /data/gatus.db

ui:
  title: SongShare status
  header: SongShare
  description: Resolving music links across streaming services.

endpoints:
  - name: app
    group: songshare
    url: http://songshare:3000/health
    interval: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == ok"

  - name: spotify
    group: providers
    url: http://songshare:3000/health/providers
    interval: 300s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].providers.spotify.status == ok"

  - name: deezer
    group: providers
    url: http://songshare:3000/health/providers
    interval: 300s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].providers.deezer.status == ok"

  - name: youtube_music
    group: providers
    url: http://songshare:3000/health/providers
    interval: 300s
    conditions:
      - "[STATUS] == 200"
      - "[BODY].providers.youtube_music.status == ok"

